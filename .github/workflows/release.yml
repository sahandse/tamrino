name: Signed Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix, e.g. 0.3.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap Android project
        run: python3 tool/bootstrap_android.py

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "KEYSTORE_BASE64 secret is missing" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "KEYSTORE_PASSWORD secret is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "KEY_ALIAS secret is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD secret is missing" && exit 1)

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 tool/configure_release_signing.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        run: flutter build apk --release --build-name '${{ steps.version.outputs.version }}' --build-number '${{ github.run_number }}'

      - name: Build signed AAB
        run: flutter build appbundle --release --build-name '${{ steps.version.outputs.version }}' --build-number '${{ github.run_number }}'

      - name: Prepare release files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "tamrino-${{ steps.version.outputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "tamrino-${{ steps.version.outputs.version }}.aab"
          sha256sum "tamrino-${{ steps.version.outputs.version }}.apk" "tamrino-${{ steps.version.outputs.version }}.aab" > SHA256SUMS.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tamrino-${{ steps.version.outputs.version }}-signed
          path: |
            tamrino-${{ steps.version.outputs.version }}.apk
            tamrino-${{ steps.version.outputs.version }}.aab
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ steps.version.outputs.tag }}'
          VERSION='${{ steps.version.outputs.version }}'
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            "tamrino-$VERSION.apk" \
            "tamrino-$VERSION.aab" \
            SHA256SUMS.txt \
            --title "تمرینو $VERSION" \
            --generate-notes

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties
